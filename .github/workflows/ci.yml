name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: mutation checks
  workflow_dispatch:

env:
  RPFM_CLI_VERSION: "4.5.4"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the mod script
        run: python3 build.py
      - name: Built script and generated data must be committed up to date
        run: git diff --exit-code -- script/campaign/mod/upgrade_all.lua tools/data_block.lua
      - name: Test suite
        run: python3 run_tests.py
      - name: Cache rpfm_cli
        id: rpfm
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rpfm_cli
          key: rpfm_cli-${{ env.RPFM_CLI_VERSION }}-${{ runner.os }}
      - name: Install rpfm_cli
        if: steps.rpfm.outputs.cache-hit != 'true'
        run: cargo install rpfm_cli --version "$RPFM_CLI_VERSION" --locked
      - name: Build the pack
        run: python3 build.py --pack
      - name: Upload the pack and the mod script
        uses: actions/upload-artifact@v4
        with:
          name: upgrade_all
          path: |
            dist/upgrade_all.pack
            script/campaign/mod/upgrade_all.lua

  mutate:
    name: Mutation checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 tools/mutate.py
